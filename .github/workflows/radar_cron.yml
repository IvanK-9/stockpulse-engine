name: StockPulse Lead Radar (Sniper Cron)

on:
  schedule:
    # Каждые 20 минут с 07:00 до 17:59 UTC, по будням (Пн-Пт)
    # 07:00 UTC = 08:00 Швеция (CET) / 10:00 Москва (MSK)
    # 17:00 UTC = 18:00 Швеция (CET) / 20:00 Москва (MSK)
    - cron: '*/20 7-17 * * 1-5'
  workflow_dispatch: # Ручной запуск в 1 клик через интерфейс GitHub Actions

jobs:
  radar-scan:
    name: Quick Radar Scan (15 Channels)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Quick Radar Scan
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_TG_ID: ${{ secrets.ADMIN_TG_ID }}
        run: |
          python -u scripts/quick_radar_scan.py
